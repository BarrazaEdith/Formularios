	<h1>Formulario con campos ocultos</h1>
	<form action="" method="post"><!--form  enviará al servidor los datos cuando el usuario presione el botón de envío y los ocultara post-->
		<input type="hidden" name="hora" value="3:30"><!--guarda y Crea un campo invisible que no se muestra en la pantalla del usuario, con el nombre de la variable hora y el valor asignado-->
		Ingresa tu nombre:
		<input type="text" name="nombre"><!--guarda tipo de dato texto en la variable nombre-->
		<br><!--salto de linea-->
		<button type="submit">Enviar</button><!--enviara los datos cuando se presione el boton enviar-->
		<button type="reset">Borrar</button><!--borrara los datos cuando se presione el boton de borrar-->
	</form>
