 <meta charset="UTF-8"><!--Hace que se pueda usar acentos y emojis en la pagina web-->

  <title>Formulario textarea EJBR-0802/title>
</head>
<body>
<h2>Formulario con text area</h2>
<form action="" method="post"><!--los datos se quedan en la pagina ocultos(post oculta los datos dentro del cuerpo)-->
Ingresa tu nombre:
<input type="text" name="nombre"><!--tipo de letra que acepta y donnde lo guarda-->
<br><!--salto de linea-->
Ingresa tu correo:
<input type="email" name="correo"><!--tipo de letra que acepta y donnde lo guarda-->
<br>
Ingresa tus comentarios:
<textarea name="comentarios" rows="1" cols="10"></textarea><!--textarea permite saltos de línea con la tecla Enter,nombre variable,rows define la altura inicial las lineas?,y cols define el ancho-->
<br>
<input type="submit" value="enviar"><!--recibe el ripo de dato cuando se presiona enviar-->
<input type="reset" value="borrar"><!--quita los datos al darle clic a borrar-->
</form>
</body>
</html>
