<head>
 <meta charset="UTF-8"><!--Hace que se pueda usar acentos y emojis en la pagina web-->

  <title>Formulario  EJBR-0802</title><!--titulo de la pagina web-->
</head>
<body>
	<h1>Formulario con archivos</h1>
	<form action="" method="post" enctype="multipart/form-data">
		Ingresa tu nombre:
		<input type="text" name="nombre"><!--guarda el tipo de dato texto en la variable nombre-->
		<br><!--salto de linea-->
		<input type="file" name="archivo"><!--muestre un botón para examinar y seleccionar archivos de la computadora o teléfono y los guardara en la variable archivo-->
		<br>
		<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button><!-- button type define que su funcion es enviar los datos,i class inserta el icono(en este caso el avion de papel)en el boton -->
		<button type="reset">Borrar <i class="fa fa-trash"></i></button><!--borra los datos e inserta el icono de bote de basura en el boton-->
	</form>
</body><!--se cierra el cuerpo-->
</html><!--se cierra el html-->
