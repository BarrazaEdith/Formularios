<body>
<h1>Formulario con limitaciones</h1><!--itulo importante-->
<form action="" method="post"><!--el form mandara los datos a la pagina " " ocultandolos con post-->
Ingresa tu nombre:
<input type="text" name="nombre" disabled><!--solo acepta tipo de dato texto con el nombre de variable disabled-->
<br><!--salto de linea-->
Contraseña:
<input type="password" name="pass" maxlength="5"><!--type password : Oculta los caracteres que el usuario escribe,asigna el identificador cuando los datos sean enviados y establece un maximo de 5 caracteres-->
<br><!--salto de linea-->
Comentarios:
<textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar</textarea><!-- textarea Crea un cuadro donde se puede escribir texto extenso en varias líneasy readonly ahce que los datos solo se puedan leer-->
<br><!--salto de linea-->
</form>
</body>
