 <meta charset="UTF-8"><!--Hace que se pueda usar acentos y emojis en la pagina web-->

<body>
	<h2>Formularios con seleccion</h2><!--titulo importante-->
	<form action="" method="post"><!--enviara y ocultara los datos dentro del cuerpo-->
		Ingresa tu nombre:
		<input type="text" name="nombre"><!--guardara tipo de dato texto en la variable nombre-->
		<br><!--salto de linea-->
		Selecciona tu pais:
		<select name="pais"><!--donde guardara la seleccion del pais-->
			<option value="1">Argentina</option><!--numero de opcion-->
			<option value="2">España</option><!--numero de opcion-->
			<option value="3">Mexico</option><!--numero de opcion-->
			<option value="4">Guatemala</option><!--numero de opcion-->
			<option value="5">Honduras</option><!--numero de opcion-->
			<option value="6">El Salvador</option><!--numero de opcion-->
			<option value="7">Venezuela</option><!--numero de opcion-->
			<option value="8">Colombia</option><!--numero de opcion-->
		</select>
		<br>
		<input type="submit" value="enviar"><!--se guardara en submit y cuando se presione enviar-->
		<input type="reset" value="borrar"><!--quita y borra los datos cuando se presiona-->
	</form>
</body>
