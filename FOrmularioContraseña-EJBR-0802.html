<head>
 <meta charset="UTF-8"><!--Hace que se pueda usar acentos y emojis en la pagina web-->
 <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--el ancho de la pagina es el mismo que en el dispositivo-->
  <title>Ejemplo básico</title>
</head>
<body>
 <h2>Formulario para contraseñas</h2>
 <form action="" method="post"><!--post hace que los datos se guarden dentro del cuerpo-->

 Ingresa tu usuario:
 <input type="text" name="usuario">><!--tipo de dato que recibe,nombre de la variable y el ancho de la letra-->
Ingresa tu contraseña:
 <input type="password" name="pass"><!-- pass =identificar y leer el valor que el usuario escribió en ese campo cuando se envía el formulario.-->
 <br>
 <input type="submit" value="enviar"><!--submit toma los datos y los envia cuando le de clic al boton de enviar-->
 <input type="reset" value="borrar">
 </form><!--form  enviará al servidor los datos cuando el usuario presione el botón de envío-->
</body>
</html>
